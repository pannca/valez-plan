name: valezplan
description: "Aplikasi personal daily planner dan alarm kencang ValezPlan"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  alarm: ^4.0.5
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/

